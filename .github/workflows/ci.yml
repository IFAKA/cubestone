name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -DCUBESTONE_TESTS=ON -DCUBESTONE_DESKTOP=OFF
      - name: Build
        run: cmake --build build-native
      - name: Test
        run: ctest --test-dir build-native --output-on-failure
